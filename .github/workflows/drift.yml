# ITCS355 Lab 4 — drift check, MANUAL fallback.
#
# The scheduled check runs as an Azure Container Apps job (`itcs355-drift`, every 15
# minutes, `python monitoring/scheduled.py` in the serving image), created by
# scripts/azure_lab4_setup.sh. This workflow runs the same detector on demand:
#
#   gh workflow run drift.yml
#
# It used to run on a GitHub schedule. On 2026-10-24/25 that schedule (*/15) fired
# 4 times in 9 hours (21:12, 23:15, 01:23, 06:29 UTC) and then not at all for 5 hours,
# including the hour after the injected drift. GitHub only promises scheduled runs
# best-effort, so a detector whose latency matters cannot depend on it. Kept as a
# manual tool, it also gives exactly one alert per drift instead of two.

name: Drift check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: drift-check
  cancel-in-progress: false

env:
  CLOUD_PROVIDER: azure
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
  CONTAINER_APP: ${{ vars.CONTAINER_APP }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  drift:
    # No staging URL configured means nothing to watch: skip quietly instead of failing
    # every 15 minutes on a fork or before setup.
    if: ${{ vars.STAGING_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-monitor.txt

      - name: Install (hash-checked, detector only)
        run: pip install --require-hashes -r requirements-monitor.txt

      - name: Azure login (OIDC) — for the metric write
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rebuild the training reference
        # Deterministic, and byte-identical to the DVC-tracked data the model learned from.
        run: python scripts/make_dataset.py

      - name: Score the live window
        env:
          MONITORING_TOKEN: ${{ secrets.MONITORING_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m monitoring.drift --current-url "${{ vars.STAGING_URL }}" --emit --notify

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("reports/drift.json")
          if not p.exists():
              print("### No drift report written"); raise SystemExit
          r = json.loads(p.read_text())
          print(f"### Drift check — {r['status']} at {r['checked_at']}")
          print(f"window: {r['window'].get('n')} readings, build {r['window'].get('build_sha')}")
          print("\n| feature | PSI | limit | KS | verdict |\n|---|---|---|---|---|")
          for f in r.get("features", []):
              print(f"| {f['feature']} | {f['psi']:.4f} | {f['threshold']} | {f['ks_statistic']:.4f} | {f['verdict']} |")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-${{ github.run_id }}
          path: reports/drift.json
          if-no-files-found: ignore
